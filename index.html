<!DOCTYPE html>
<html lang="en">

  <style>

      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #9fd5df;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;

    }
  </style>
</head>
<body>

      <stop offset="0.45" stop-color="#ffe89c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe89c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82aeb6"/>
      <stop offset="1" stop-color="#a7c9c1"/>
    </linearGradient>
    <linearGradient id="nearMountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8790"/>
      <stop offset="1" stop-color="#78a69d"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ac8c9"/>
      <stop offset="0.48" stop-color="#62b2bd"/>
      <stop offset="1" stop-color="#438e9e"/>

    <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7d887"/>
      <stop offset="0.5" stop-color="#8fbd69"/>
      <stop offset="1" stop-color="#638f53"/>
    </linearGradient>
    <linearGradient id="pelicanCream" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.6" stop-color="#fff2d8"/>
      <stop offset="1" stop-color="#efc5a5"/>
    </linearGradient>
    <linearGradient id="pelicanWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d7b8"/>
      <stop offset="1" stop-color="#dca57f"/>

    <linearGradient id="coralFrame" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="tealFrame" x1="0" y1="0" x2="0" y2="1">

    <linearGradient id="controllerBody" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#9c82ff"/>
      <stop offset="0.5" stop-color="#7355e8"/>
      <stop offset="1" stop-color="#4c32b3"/>
    </linearGradient>
    <linearGradient id="beakGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd45c"/>
      <stop offset="1" stop-color="#eea332"/>
    </linearGradient>
    <filter id="cloudBlur" x="-20%" y="-40%" width="140%" height="180%">

      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
